<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Roaring Twenties Jeopardy — Buzz In</title>
<style>
  :root{
    --bg:#0b1511; --surface:#132019; --surface-2:#1a2b21;
    --ink:#f3ead9; --ink-dim:#c9bfa9; --gold:#c9a24b; --gold-bright:#e8c874;
    --emerald:#1f4d3d; --burgundy:#7a2331; --burgundy-bright:#a8364a; --focus:#e8c874;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body{
    background: var(--bg); color: var(--ink);
    font-family: 'Josefin Sans', 'Trebuchet MS', sans-serif;
    padding: max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
    display:flex; align-items:center; justify-content:center;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(201,162,75,0.08), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(122,35,49,0.10), transparent 45%);
  }
  .wrap{ width:100%; max-width:440px; display:flex; flex-direction:column; gap:18px; }
  h1,h2,h3 { text-wrap: balance; margin: 0; }
  .eyebrow{ letter-spacing:.3em; text-transform:uppercase; font-size:.68rem; color:var(--gold); text-align:center; }
  .title{
    font-family:'Bebas Neue','Josefin Sans',sans-serif; font-size: clamp(1.8rem, 8vw, 2.6rem);
    letter-spacing:.04em; color: var(--gold-bright); text-align:center; line-height:1;
  }
  .card{
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 2px solid var(--gold); border-radius: 8px;
    box-shadow: 0 0 0 6px var(--bg), 0 0 0 7px rgba(201,162,75,0.35);
    padding: 24px clamp(16px,5vw,32px); display:flex; flex-direction:column; gap:16px;
  }
  label{ font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim); }
  input[type=text]{
    font-family:'Josefin Sans',sans-serif; font-weight:600; font-size:1.1rem;
    background: var(--surface); border:1.5px solid rgba(201,162,75,0.4); border-radius:4px;
    color: var(--ink); padding:12px 14px; width:100%;
  }
  input[type=text]:focus-visible{ outline:3px solid var(--focus); }
  .room-input{ font-family:'Bebas Neue',sans-serif; font-size:1.8rem; letter-spacing:.2em; text-align:center; text-transform:uppercase; }
  button{
    font-family:'Josefin Sans',sans-serif; font-weight:700; letter-spacing:.03em; border-radius:4px;
    border: 1.5px solid var(--gold); background: var(--gold); color:#1a1208;
    padding: 14px 16px; cursor:pointer; font-size:1rem;
  }
  button:active{ transform: scale(.98); }
  button:disabled{ opacity:.4; cursor:default; }
  .team-pick{ display:flex; flex-direction:column; gap:8px; }
  .team-pick button{ background:transparent; color:var(--gold-bright); text-align:left; display:flex; justify-content:space-between; }
  .team-pick button.selected{ background: var(--gold); color:#1a1208; }
  .error{ color: var(--burgundy-bright); font-size:.85rem; text-align:center; min-height:1.2em; }

  .status-line{ text-align:center; font-size:.85rem; color:var(--ink-dim); }
  .status-line b{ color:var(--gold-bright); }

  .buzz-btn{
    width:100%; aspect-ratio: 1 / 1; border-radius: 50%;
    font-family:'Bebas Neue',sans-serif; font-size: clamp(1.8rem,10vw,2.6rem); letter-spacing:.04em;
    border: 6px solid var(--burgundy-bright); background: var(--burgundy);
    color: var(--ink); box-shadow: 0 0 0 8px var(--bg), 0 0 30px rgba(168,54,74,0.5);
    transition: transform .08s, background .15s;
  }
  .buzz-btn.ready{ background: var(--burgundy-bright); animation: pulse 1.1s ease-in-out infinite; cursor:pointer; }
  .buzz-btn.ready:active{ transform: scale(.95); }
  .buzz-btn.locked{ background: var(--surface-2); border-color: rgba(201,162,75,0.3); color: var(--ink-dim); box-shadow:none; }
  .buzz-btn.won{ background: var(--gold); border-color: var(--gold-bright); color:#1a1208; box-shadow: 0 0 0 8px var(--bg), 0 0 36px rgba(232,200,116,0.6); }
  @keyframes pulse { 0%,100%{ box-shadow: 0 0 0 8px var(--bg), 0 0 30px rgba(168,54,74,0.5);} 50%{ box-shadow: 0 0 0 8px var(--bg), 0 0 48px rgba(168,54,74,0.85);} }

  .big-status{ text-align:center; font-family:'Bebas Neue',sans-serif; font-size: clamp(1.3rem,6vw,1.9rem); letter-spacing:.03em; }
  .scorebit{ display:flex; justify-content:space-between; align-items:baseline; }
  .scorebit .n{ font-family:'Bebas Neue',sans-serif; font-size:1.3rem; color:var(--gold-bright); }
  [hidden]{ display:none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<div class="wrap">
  <div class="eyebrow">Roaring Twenties Jeopardy</div>
  <h1 class="title">Buzz In</h1>

  <!-- Join card -->
  <div class="card" id="joinCard">
    <div>
      <label for="roomInput">Room Code</label>
      <input type="text" id="roomInput" class="room-input" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="----">
    </div>
    <div>
      <label for="nameInput">Your Name</label>
      <input type="text" id="nameInput" maxlength="24" autocomplete="off" placeholder="First name">
    </div>
    <div id="teamSection" hidden>
      <label>Pick Your Team</label>
      <div class="team-pick" id="teamPick"></div>
    </div>
    <div class="error" id="joinError"></div>
    <button id="btnFindRoom">Find Room</button>
    <button id="btnJoin" hidden>Join Game</button>
  </div>

  <!-- Waiting / play card -->
  <div class="card" id="playCard" hidden>
    <div class="scorebit"><span id="teamLabel">Team</span><span class="n" id="teamScore">$0</span></div>
    <div id="waitingMsg" class="big-status" hidden>Waiting for the teacher to start&hellip;</div>
    <button class="buzz-btn locked" id="buzzBtn" hidden disabled>READY</button>
    <div class="big-status" id="bigStatus" hidden></div>
    <button type="button" id="btnLeave" style="background:transparent;color:var(--ink-dim);border-color:rgba(201,162,75,0.3);font-weight:600;">Leave Game</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  firebase.initializeApp(FIREBASE_CONFIG);
  var db = firebase.database();

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(ch){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch];
    });
  }
  function storageSafeGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
  function storageSafeSet(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }

  var roomInput = document.getElementById("roomInput");
  var nameInput = document.getElementById("nameInput");
  var joinError = document.getElementById("joinError");
  var teamSection = document.getElementById("teamSection");
  var teamPick = document.getElementById("teamPick");
  var btnFindRoom = document.getElementById("btnFindRoom");
  var btnJoin = document.getElementById("btnJoin");
  var joinCard = document.getElementById("joinCard");
  var playCard = document.getElementById("playCard");

  var roomCode = null, roomRef = null, teams = null, selectedTeam = null;
  var pid = storageSafeGet("rt-jeopardy-pid");
  if(!pid){
    pid = "p" + Date.now() + Math.random().toString(36).slice(2,8);
    storageSafeSet("rt-jeopardy-pid", pid);
  }

  roomInput.addEventListener("input", function(){
    roomInput.value = roomInput.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);
  });

  btnFindRoom.addEventListener("click", function(){
    var code = roomInput.value.trim();
    if(code.length !== 4){ joinError.textContent = "Enter the 4-character room code."; return; }
    joinError.textContent = "";
    db.ref("games/" + code).once("value").then(function(snap){
      var val = snap.val();
      if(!val){ joinError.textContent = "No game found with that code."; return; }
      roomCode = code;
      teams = val.teams || {};
      renderTeamPicker();
      teamSection.hidden = false;
      btnFindRoom.hidden = true;
      btnJoin.hidden = false;
    }).catch(function(err){
      joinError.textContent = "Couldn't reach the game. Check your internet connection.";
    });
  });

  function renderTeamPicker(){
    teamPick.innerHTML = "";
    Object.keys(teams).forEach(function(tid){
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span>' + escapeHtml(teams[tid].name) + '</span><span>$' + teams[tid].score + '</span>';
      b.addEventListener("click", function(){
        selectedTeam = tid;
        Array.prototype.forEach.call(teamPick.children, function(el){ el.classList.remove("selected"); });
        b.classList.add("selected");
      });
      teamPick.appendChild(b);
    });
  }

  btnJoin.addEventListener("click", function(){
    var name = nameInput.value.trim();
    if(!name){ joinError.textContent = "Enter your name."; return; }
    if(selectedTeam === null){ joinError.textContent = "Pick a team."; return; }
    joinError.textContent = "";
    roomRef = db.ref("games/" + roomCode);
    roomRef.child("players/" + pid).set({ name: name, teamId: selectedTeam, joinedAt: firebase.database.ServerValue.TIMESTAMP }).then(function(){
      storageSafeSet("rt-jeopardy-room", roomCode);
      storageSafeSet("rt-jeopardy-name", name);
      storageSafeSet("rt-jeopardy-team", selectedTeam);
      joinCard.hidden = true;
      playCard.hidden = false;
      attachGameListener();
    }).catch(function(err){
      joinError.textContent = "Couldn't join (check your internet connection).";
    });
  });

  /* ---------------- Rejoin automatically if this device already joined this session ---------------- */
  (function tryAutoRejoin(){
    var savedRoom = storageSafeGet("rt-jeopardy-room");
    if(!savedRoom) return;
    db.ref("games/" + savedRoom + "/players/" + pid).once("value").then(function(snap){
      if(snap.exists()){
        roomCode = savedRoom;
        roomRef = db.ref("games/" + roomCode);
        joinCard.hidden = true;
        playCard.hidden = false;
        attachGameListener();
      }
    }).catch(function(){});
  })();

  /* ---------------- Live game state ---------------- */
  var myTeamId = null;
  var hasBuzzedThisClue = false;
  var lastClueKey = null;

  function attachGameListener(){
    roomRef.on("value", function(snap){
      var game = snap.val();
      if(!game){ return; }
      var me = game.players && game.players[pid];
      myTeamId = me ? me.teamId : null;
      var team = myTeamId !== null && game.teams ? game.teams[myTeamId] : null;

      document.getElementById("teamLabel").textContent = team ? team.name : "Your team";
      document.getElementById("teamScore").textContent = team ? ("$" + team.score) : "$0";

      var waitingMsg = document.getElementById("waitingMsg");
      var buzzBtn = document.getElementById("buzzBtn");
      var bigStatus = document.getElementById("bigStatus");

      if(game.status !== "playing"){
        waitingMsg.hidden = false;
        buzzBtn.hidden = true;
        bigStatus.hidden = true;
        return;
      }
      waitingMsg.hidden = true;

      var clue = game.currentClue;
      if(!clue || clue.isDD){
        buzzBtn.hidden = true;
        bigStatus.hidden = !clue;
        if(clue && clue.isDD){
          bigStatus.textContent = (myTeamId !== null && String(game.activeTeam) === String(myTeamId))
            ? "Daily Double! Your team is answering out loud."
            : "Daily Double — another team is answering.";
          bigStatus.hidden = false;
        }
        if(clue && clue.key !== lastClueKey){ lastClueKey = clue.key; hasBuzzedThisClue = false; }
        if(!clue) lastClueKey = null;
        return;
      }

      if(clue.key !== lastClueKey){ lastClueKey = clue.key; hasBuzzedThisClue = false; }

      var excluded = (clue.excludedTeams && myTeamId !== null) ? !!clue.excludedTeams[myTeamId] : false;

      buzzBtn.hidden = false;
      bigStatus.hidden = true;

      if(clue.buzzWinner){
        var iWon = String(clue.buzzWinner.teamId) === String(myTeamId);
        buzzBtn.disabled = true;
        buzzBtn.className = "buzz-btn " + (iWon ? "won" : "locked");
        buzzBtn.textContent = iWon ? "YOU'RE UP!" : "LOCKED";
        if(!iWon){
          bigStatus.hidden = false;
          bigStatus.textContent = clue.buzzWinner.name + "'s team buzzed in first.";
        }
      } else if(excluded){
        buzzBtn.disabled = true;
        buzzBtn.className = "buzz-btn locked";
        buzzBtn.textContent = "TRY NEXT CLUE";
      } else {
        buzzBtn.disabled = false;
        buzzBtn.className = "buzz-btn ready";
        buzzBtn.textContent = "BUZZ IN!";
      }
    });
  }

  document.getElementById("buzzBtn").addEventListener("click", function(){
    if(!roomRef || myTeamId === null) return;
    var clueRef = roomRef.child("currentClue");
    clueRef.child("buzzWinner").transaction(function(current){
      if(current === null){
        return { pid: pid, name: nameInput.value.trim() || storageSafeGet("rt-jeopardy-name") || "A student", teamId: myTeamId, time: Date.now() };
      }
      return; // abort — someone already buzzed
    });
  });

  document.getElementById("btnLeave").addEventListener("click", function(){
    if(!confirm("Leave this game? You can join the same game or a new one with a room code.")) return;
    if(roomRef){
      roomRef.child("players/" + pid).remove().catch(function(){});
      roomRef.off();
    }
    try{
      localStorage.removeItem("rt-jeopardy-room");
      localStorage.removeItem("rt-jeopardy-name");
      localStorage.removeItem("rt-jeopardy-team");
    }catch(e){}
    roomRef = null; roomCode = null; teams = null; selectedTeam = null; myTeamId = null;
    lastClueKey = null; hasBuzzedThisClue = false;

    roomInput.value = "";
    nameInput.value = "";
    joinError.textContent = "";
    teamSection.hidden = true;
    teamPick.innerHTML = "";
    btnFindRoom.hidden = false;
    btnJoin.hidden = true;

    document.getElementById("playCard").hidden = true;
    joinCard.hidden = false;
    roomInput.focus();
  });

})();
</script>
